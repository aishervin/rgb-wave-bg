<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RGB Wavy Gradient Flow | ☬SHΞN™</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030712;
      font-family: "Vazirmatn", sans-serif;
      color: #fff;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      text-align: center;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 3rem 4rem;
      border-radius: 2rem;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }
    h1 {
      font-family: "Orbitron", sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #f43f5e, #8b5cf6, #06b6d4, #10b981);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rgbGradient 8s ease infinite;
      margin-bottom: 0.8rem;
    }
    p {
      font-size: 1.15rem;
      color: #cbd5e1;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }
    .badge {
      display: inline-block;
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 0.4rem 1.2rem;
      border-radius: 9999px;
      font-weight: 700;
    }
    @keyframes rgbGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>
  <canvas id="wavesCanvas"></canvas>
  <div class="overlay">
    <h1>RGB WAVE MATRIX</h1>
    <p>بک‌گراند گرادیانت مواج متحرک با شبیه‌ساز امواج سیال</p>
    <div class="badge">Exclusive ☬SHΞN™ Made · aishervin/rgb-wave-bg</div>
  </div>

  <script>
    const canvas = document.getElementById("wavesCanvas");
    const ctx = canvas.getContext("2d");

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    let step = 0;
    const waves = [
      { frequency: 0.008, speed: 0.025, amplitude: 90, colorA: "rgba(244, 63, 94, 0.45)", colorB: "rgba(139, 92, 246, 0.2)" },
      { frequency: 0.012, speed: 0.035, amplitude: 70, colorA: "rgba(6, 182, 212, 0.4)", colorB: "rgba(59, 130, 246, 0.15)" },
      { frequency: 0.006, speed: 0.02, amplitude: 110, colorA: "rgba(16, 185, 129, 0.35)", colorB: "rgba(234, 179, 8, 0.15)" },
      { frequency: 0.015, speed: 0.045, amplitude: 60, colorA: "rgba(168, 85, 247, 0.4)", colorB: "rgba(236, 72, 153, 0.25)" }
    ];

    function draw() {
      ctx.fillStyle = "#030712";
      ctx.fillRect(0, 0, width, height);

      step += 0.02;

      waves.forEach((w, idx) => {
        ctx.beginPath();
        ctx.moveTo(0, height);

        for (let x = 0; x <= width; x += 10) {
          const y = height * 0.5 + Math.sin(x * w.frequency + step * (idx + 1) * 0.7) * w.amplitude +
                    Math.cos(x * 0.004 + step * 0.5) * (w.amplitude * 0.5);
          ctx.lineTo(x, y);
        }

        ctx.lineTo(width, height);
        ctx.closePath();

        const grad = ctx.createLinearGradient(0, 0, width, height);
        grad.addColorStop(0, w.colorA);
        grad.addColorStop(1, w.colorB);
        ctx.fillStyle = grad;
        ctx.fill();
      });

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
